apiVersion: v1
kind: Namespace
metadata:
  name: test
  labels:
    app.kubernetes.io/part-of: test

---

apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: macvlan-lan-test
  namespace: test
  labels:
    app.kubernetes.io/part-of: test
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "frontlan",
      "type": "macvlan",
      "master": "eno1",
      "mode": "bridge",
      "ipam": {
        "type": "static",
        "ip": "10.0.0.140",
        "gateway": "10.0.0.1"
      }
    }

---

apiVersion: v1
kind: Pod
metadata:
  name: macvlan-test
  namespace: test
  annotations:
    k8s.v1.cni.cncf.io/networks: macvlan-lan-test
  labels:
    app.kubernetes.io/part-of: test
spec:
  containers:
  - name: test
    image: busybox
    command: ["sleep", "3600"]
