#
# Seems to have two deps? Need to assess against current k3s 
# - kubectl apply -f \
#   https://raw.githubusercontent.com/k8snetworkplumbingwg/multus-cni/master/deployments/multus-daemonset-thick.yml

apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: macvlan-lan
  namespace: default
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "frontlan",
      "type": "macvlan",
      "master": "eno1",
      "mode": "bridge",
      "ipam": {
        "type": "static",
        "ip": "10.0.0.150",
        "gateway": "10.0.0.1"
      }
    }
