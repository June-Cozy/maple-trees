apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-embed
  namespace: cozy-ai
  labels:
    app: embed
    model: qwen3-0.6b
    runtime: llama-cpp
    tier: inference
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: embed
      model: qwen3-0.6b
  template:
    metadata:
      labels:
        app: embed
        model: qwen3-0.6b
        runtime: llama-cpp
        tier: inference
    spec:
      enableServiceLinks: false
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 1.1.1.1
          - 8.8.8.8
      containers:
        - name: llama-cpp
          image: docker.io/library/llama-cpp-qwen3:jp6
          imagePullPolicy: Never
          command: ["sh", "-c"]
          args:
            - |
              llama-server \
                --model $(huggingface-downloader Qwen/Qwen3-Embedding-0.6B-GGUF/Qwen3-Embedding-0.6B-Q8_0.gguf) \
                --host 0.0.0.0 \
                --port 8000 \
                -ngl 99 \
                --ctx-size 2048 \
                --embedding \
                --pooling cls \
                --parallel 1 \
                --threads 2 \
                --threads-batch 2 \
                --batch-size 2048 \
                --ubatch-size 2048
          env:
            - name: HF_HOME
              value: /models/.hf-cache
            - name: HF_HUB_DISABLE_IPV6
              value: "1"
            - name: CURL_IPRESOLVE
              value: "4"
            - name: GAI_RESOLVE_IPV4
              value: "1"
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
          ports:
            - containerPort: 8000
              name: api
          volumeMounts:
            - name: models
              mountPath: /models
          resources:
            requests:
              memory: "2Gi"
              cpu: "1"
              nvidia.com/gpu: "1"
            limits:
              memory: "6Gi"
              cpu: "2"
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: models
---
apiVersion: v1
kind: Service
metadata:
  name: qwen-embed
  namespace: cozy-ai
  labels:
    app: embed
    model: qwen3-0.6b
    runtime: llama-cpp
    tier: inference
spec:
  type: NodePort
  selector:
    app: embed
    model: qwen3-0.6b
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
      protocol: TCP
      name: api
