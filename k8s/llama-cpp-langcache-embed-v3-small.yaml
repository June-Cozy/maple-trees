apiVersion: apps/v1
kind: Deployment
metadata:
  name: langcache
  namespace: cozy-ai
  labels:
    app: embed
    model: langcache-v3
    runtime: llama-cpp
    tier: inference
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: embed
      model: langcache-v3
  template:
    metadata:
      labels:
        app: embed
        model: langcache-v3
        runtime: llama-cpp
        tier: inference
    spec:
      enableServiceLinks: false
      containers:
        - name: llama-cpp
          image: docker.io/library/llama-cpp-langcache:jp6
          imagePullPolicy: Never
          command:
            - llama-server
            - --model
            - /models/langcache-embed-v3-small-F16.gguf
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - -ngl
            - "99"
            - --embedding
            - --pooling
            - cls
            - --parallel
            - "1"
            - --fit
            - "off"
          ports:
            - containerPort: 8000
              name: api
          resources:
            requests:
              memory: "512Mi"
              cpu: "1"
              nvidia.com/gpu: "1"
            limits:
              memory: "2Gi"
              cpu: "2"
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: langcache
  namespace: cozy-ai
  labels:
    app: embed
    model: langcache-v3
    runtime: llama-cpp
    tier: inference
spec:
  type: NodePort
  selector:
    app: embed
    model: langcache-v3
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30801
      protocol: TCP
      name: api
